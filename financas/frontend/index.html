<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Controle Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <span class="logo">💰</span>
      <h1>Bem-vindo de volta!</h1>
      <p class="subtitle">Entre para gerenciar suas finanças</p>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
      <p class="text-center mt-2">
        Não tem conta? <a href="cadastro.html" class="link">Cadastre-se</a>
      </p>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Api && window.Api.auth) {
        window.Api.auth.redirectIfLoggedIn();
      }
      const loginBtn = document.getElementById('loginBtn');
      const passwordInput = document.getElementById('password');
      if (loginBtn) {
        loginBtn.addEventListener('click', doLogin);
      }
      if (passwordInput) {
        passwordInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') doLogin();
        });
      }
    });

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      if (!window.App || !window.Api) return;
      if (!email || !password) {
        window.App.showToast('Preencha email e senha.', 'warning');
        return;
      }
      window.App.setLoading(btn, true);
      try {
        await window.Api.auth.login(email, password);
        window.App.showToast('Login realizado!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 400);
      } catch (err) {
        window.App.showToast(err.message, 'error');
      } finally {
        window.App.setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
