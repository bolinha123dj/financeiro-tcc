<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Controle Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2><span>💰</span> Finanças</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="active"><span>📊</span> Dashboard</a>
      <a href="perfil.html"><span>👤</span> Perfil</a>
      <a href="configuracoes.html"><span>⚙️</span> Configurações</a>
      <a href="#" onclick="Api.auth.logout(); return false;"><span>🚪</span> Sair</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">?</div>
        <div class="user-details">
          <div class="name" data-user-name>Carregando...</div>
          <div class="email" data-user-email></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <header class="header">
      <div class="d-flex align-center gap-2">
        <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
        <h1>Dashboard</h1>
      </div>
      <div class="month-selector">
        <select id="filterMonth"></select>
        <select id="filterYear"></select>
      </div>
    </header>

    <div class="page-content">

      <!-- Cards de resumo -->
      <div class="stats-grid">
        <div class="stat-card income">
          <div class="stat-icon green">📈</div>
          <div class="stat-info">
            <div class="label">Receitas</div>
            <div class="value positive" id="totalIncome">R$ 0,00</div>
          </div>
        </div>
        <div class="stat-card expense">
          <div class="stat-icon red">📉</div>
          <div class="stat-info">
            <div class="label">Despesas</div>
            <div class="value negative" id="totalExpense">R$ 0,00</div>
          </div>
        </div>
        <div class="stat-card balance">
          <div class="stat-icon blue">💎</div>
          <div class="stat-info">
            <div class="label">Saldo</div>
            <div class="value" id="totalBalance">R$ 0,00</div>
          </div>
        </div>
        <div class="stat-card goals">
          <div class="stat-icon purple">🎯</div>
          <div class="stat-info">
            <div class="label">Metas</div>
            <div class="value" id="totalGoals" style="color:var(--purple)">0 ativas</div>
          </div>
        </div>
      </div>

      <!-- Grid principal -->
      <div class="dashboard-grid">

        <!-- Coluna esquerda: Transações -->
        <div>
          <div class="card">
            <div class="card-header">
              <h3>Transações Recentes</h3>
              <button class="btn btn-primary btn-sm" onclick="openNewTransaction()">+ Nova</button>
            </div>
            <div class="card-body" style="padding-bottom:0">
              <div class="filters-bar">
                <button class="filter-chip active" data-type="all"     onclick="setFilter('all')">Todas</button>
                <button class="filter-chip"         data-type="income"  onclick="setFilter('income')">Receitas</button>
                <button class="filter-chip"         data-type="expense" onclick="setFilter('expense')">Despesas</button>
                <div class="search-bar">
                  <input type="text" placeholder="Buscar transação…" oninput="setSearch(this.value)">
                </div>
              </div>
            </div>
            <div id="transactionsList" class="card-body" style="padding-top:0"></div>
          </div>
        </div>

        <!-- Coluna direita: Gráfico + Metas -->
        <div style="display:flex;flex-direction:column;gap:20px;">

          <!-- Gráfico -->
          <div class="card">
            <div class="card-header">
              <h3>Distribuição</h3>
            </div>
            <div class="card-body">
              <div class="chart-wrap" style="height:180px">
                <canvas id="summaryChart"></canvas>
              </div>
              <div class="d-flex gap-2 mt-2" style="justify-content:center;font-size:0.8rem">
                <span style="color:var(--accent)">● Receitas</span>
                <span style="color:var(--danger)">● Despesas</span>
              </div>
            </div>
          </div>

          <!-- Metas -->
          <div class="card">
            <div class="card-header">
              <h3>Metas Financeiras</h3>
              <button class="btn btn-ghost btn-sm" onclick="openNewGoal()">+ Meta</button>
            </div>
            <div id="goalsList" class="card-body"></div>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal: Nova / Editar Transação -->
<div class="modal-overlay" id="transactionModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="transactionModalTitle">➕ Nova Transação</h3>
      <button class="modal-close" onclick="App.closeModal('transactionModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="transactionForm" onsubmit="return false;">
        <div class="type-selector">
          <button type="button" class="type-btn" data-type="income">⬆ Receita</button>
          <button type="button" class="type-btn" data-type="expense">⬇ Despesa</button>
        </div>
        <input type="hidden" id="transactionType">

        <div class="form-group">
          <label>Descrição</label>
          <input type="text" id="transactionDescription" placeholder="Ex: Salário de maio" required>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" id="transactionAmount" step="0.01" min="0.01" placeholder="0,00" required>
          </div>
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="transactionDate" required>
          </div>
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="transactionCategory" required></select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="App.closeModal('transactionModal')">Cancelar</button>
      <button class="btn btn-primary" id="saveTransactionBtn" onclick="document.getElementById('transactionForm').dispatchEvent(new Event('submit'))">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Nova / Editar Meta -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="goalModalTitle">🎯 Nova Meta</h3>
      <button class="modal-close" onclick="App.closeModal('goalModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="goalForm" onsubmit="return false;">
        <div class="form-group">
          <label>Nome da Meta</label>
          <input type="text" id="goalName" placeholder="Ex: Reserva de Emergência" required>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>Valor Alvo (R$)</label>
            <input type="number" id="goalTarget" step="0.01" min="0.01" placeholder="10.000,00" required>
          </div>
          <div class="form-group">
            <label>Já guardou (R$)</label>
            <input type="number" id="goalCurrent" step="0.01" min="0" placeholder="0,00" value="0">
          </div>
        </div>
        <div class="form-group">
          <label>Prazo (opcional)</label>
          <input type="date" id="goalDeadline">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="App.closeModal('goalModal')">Cancelar</button>
      <button class="btn btn-primary" id="saveGoalBtn" onclick="document.getElementById('goalForm').dispatchEvent(new Event('submit'))">Salvar</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script>
  // Atualiza contador de metas no card de resumo
  const _origLoadGoals = loadGoals;
  async function loadGoals() {
    await _origLoadGoals();
    const el = document.getElementById('totalGoals');
    if (el) el.textContent = `${State.goals.length} ${State.goals.length === 1 ? 'ativa' : 'ativas'}`;
  }
</script>
</body>
</html>
