<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Controle Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2><span>💰</span> Finanças</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><span>📊</span> Dashboard</a>
      <a href="perfil.html" class="active"><span>👤</span> Perfil</a>
      <a href="configuracoes.html"><span>⚙️</span> Configurações</a>
      <a href="#" onclick="Api.auth.logout(); return false;"><span>🚪</span> Sair</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">?</div>
        <div class="user-details">
          <div class="name" data-user-name>Carregando...</div>
          <div class="email" data-user-email></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <div class="d-flex align-center gap-2">
        <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
        <h1>Meu Perfil</h1>
      </div>
    </header>

    <div class="page-content">

      <!-- Informações Pessoais -->
      <div class="card mb-3">
        <div class="card-header">
          <h3>👤 Informações Pessoais</h3>
        </div>
        <div class="card-body">
          <div style="text-align:center;margin-bottom:24px;">
            <div class="profile-avatar-lg" id="profileAvatar">?</div>
            <h2 id="profileName" style="font-size:1.3rem;margin-bottom:4px;">Carregando...</h2>
            <p class="text-muted" id="profileEmail"></p>
          </div>

          <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="inputName" placeholder="Seu nome">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="inputEmail" placeholder="seu@email.com">
          </div>
          <button class="btn btn-primary" id="saveProfileBtn" onclick="saveProfile()">Salvar Alterações</button>
        </div>
      </div>

      <!-- Alterar Senha -->
      <div class="card mb-3">
        <div class="card-header">
          <h3>🔒 Alterar Senha</h3>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label>Senha Atual</label>
            <input type="password" id="currentPassword" placeholder="Sua senha atual">
          </div>
          <div class="form-group">
            <label>Nova Senha</label>
            <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres">
          </div>
          <div class="form-group">
            <label>Confirmar Nova Senha</label>
            <input type="password" id="confirmPassword" placeholder="Repita a nova senha">
          </div>
          <button class="btn btn-primary" id="savePwdBtn" onclick="savePassword()">Alterar Senha</button>
        </div>
      </div>

      <!-- Estatísticas -->
      <div class="card">
        <div class="card-header">
          <h3>📊 Estatísticas da Conta</h3>
        </div>
        <div class="card-body">
          <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card">
              <div class="stat-icon blue">📅</div>
              <div class="stat-info">
                <div class="label">Membro desde</div>
                <div class="value" id="memberSince">—</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon green">💳</div>
              <div class="stat-info">
                <div class="label">Total de Transações</div>
                <div class="value" id="totalTransactions">—</div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  if (!Api.auth.requireAuth()) window.location.href = 'index.html';

  document.addEventListener('DOMContentLoaded', async () => {
    App.updateUserAvatar();
    try {
      const user = await Api.auth.getProfile();
      document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('profileName').textContent   = user.name;
      document.getElementById('profileEmail').textContent  = user.email;
      document.getElementById('inputName').value           = user.name;
      document.getElementById('inputEmail').value          = user.email;
      document.getElementById('memberSince').textContent   = App.formatDate(user.created_at);
    } catch (err) {
      App.showToast('Erro ao carregar perfil.', 'error');
    }

    try {
      const txs = await Api.transactions.list();
      document.getElementById('totalTransactions').textContent = txs.length;
    } catch (_) {}
  });

  async function saveProfile() {
    const btn   = document.getElementById('saveProfileBtn');
    const name  = document.getElementById('inputName').value.trim();
    const email = document.getElementById('inputEmail').value.trim();
    if (!name || !email) { App.showToast('Preencha nome e email.', 'warning'); return; }
    App.setLoading(btn, true);
    try {
      await Api.auth.updateProfile({ name, email });
      App.showToast('Perfil atualizado!', 'success');
      App.updateUserAvatar();
      document.getElementById('profileName').textContent  = name;
      document.getElementById('profileEmail').textContent = email;
      document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
    } catch (err) {
      App.showToast(err.message, 'error');
    } finally {
      App.setLoading(btn, false);
    }
  }

  async function savePassword() {
    const btn     = document.getElementById('savePwdBtn');
    const current = document.getElementById('currentPassword').value;
    const newPwd  = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (!current || !newPwd || !confirm) { App.showToast('Preencha todos os campos.', 'warning'); return; }
    if (newPwd !== confirm)              { App.showToast('As senhas não coincidem.', 'error');    return; }
    if (newPwd.length < 6)              { App.showToast('Mínimo 6 caracteres.', 'error');         return; }
    App.setLoading(btn, true);
    try {
      await Api.auth.changePassword(current, newPwd);
      App.showToast('Senha alterada com sucesso!', 'success');
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value     = '';
      document.getElementById('confirmPassword').value = '';
    } catch (err) {
      App.showToast(err.message, 'error');
    } finally {
      App.setLoading(btn, false);
    }
  }
</script>
</body>
</html>
