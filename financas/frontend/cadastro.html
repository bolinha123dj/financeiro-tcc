<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Controle Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <span class="logo">💰</span>
      <h1>Criar Conta</h1>
      <p class="subtitle">Comece a controlar suas finanças</p>

      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" placeholder="Seu nome" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input type="password" id="confirmPassword" placeholder="Repita a senha" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-block" id="registerBtn" onclick="doRegister()">Criar Conta</button>

      <p class="text-center mt-2">
        Já tem conta? <a href="index.html" class="link">Entrar</a>
      </p>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Api.auth.redirectIfLoggedIn();

    async function doRegister() {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirmPassword').value;
      const btn      = document.getElementById('registerBtn');

      if (!name || !email || !password || !confirm) {
        App.showToast('Preencha todos os campos.', 'warning');
        return;
      }
      if (password !== confirm) {
        App.showToast('As senhas não coincidem.', 'error');
        return;
      }
      if (password.length < 6) {
        App.showToast('A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }

      App.setLoading(btn, true);
      try {
        await Api.auth.register(name, email, password);
        App.showToast('Conta criada com sucesso!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 400);
      } catch (err) {
        App.showToast(err.message, 'error');
      } finally {
        App.setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
